<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诗境·中国 - 计算机设计大赛</title>
    
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    
    <style>
        /* 全局青绿山水配色 [cite: 11, 24] */
        body { 
            margin: 0; 
            background-color: #f5f5dc; 
            font-family: "Microsoft YaHei", "STKaiti", serif; 
            color: #2f4f4f;
        }
        #app { max-width: 600px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 70px; }
        
        /* 顶部导航栏 [cite: 4, 16] */
        .header { background: #2f4f4f; color: #fff; padding: 15px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        
        /* 地图区域 [cite: 6, 32] */
        #map-container { width: 100%; height: 400px; background: #e0eee8; border-bottom: 2px solid #2e8b57; }
        
        /* 底部滚动卡片区域 [cite: 8, 11] */
        .card-row { display: flex; overflow-x: auto; padding: 15px; gap: 15px; scrollbar-width: none; }
        .card-row::-webkit-scrollbar { display: none; }
        
        .poem-card { 
            min-width: 220px; 
            border-radius: 12px; 
            cursor: pointer; 
            border: 1px solid #dcdcdc;
            transition: transform 0.3s;
        }
        .poem-card:hover { transform: translateY(-5px); }
        .poem-card img { width: 100%; height: 130px; object-fit: cover; border-radius: 8px 8px 0 0; }
        
        /* 底部菜单栏 [cite: 3, 42, 56, 82] */
        .nav-footer { position: fixed; bottom: 0; width: 100%; max-width: 600px; border-top: 1px solid #ddd; }
        
        /* 智能解读弹窗美化 [cite: 72, 77] */
        .el-dialog { border-radius: 15px !important; }
        .tag-box { margin: 10px 0; }
        .translation-text { text-align: justify; line-height: 1.6; color: #444; }
    </style>
</head>
<body>

<div id="app">
    <div class="header">
        <h2 style="margin:0; font-weight: normal; letter-spacing: 2px;">诗境·中国</h2>
    </div>

    <div id="map-container"></div>

    <div class="card-row">
        <el-card v-for="item in spots" :key="item.name" class="poem-card" @click="showDetail(item)" shadow="hover">
            <img :src="item.img" alt="地点图片">
            <div style="padding: 10px;">
                <h4 style="margin: 5px 0;">{{item.name}} · {{item.poet}}</h4>
                <p style="font-size: 13px; color: #666; margin: 0;">{{item.poem}}</p>
            </div>
        </el-card>
    </div>

    <el-dialog v-model="dialogVisible" :title="activeSpot.poem" width="90%" center>
        <div style="text-align: center;">
            <div class="tag-box">
                <el-tag type="success" effect="dark">{{activeSpot.poet}} · {{activeSpot.dynasty}}</el-tag>
                <el-tag type="danger" style="margin-left: 10px;">{{activeSpot.tag}}</el-tag>
            </div>
            <el-divider>白话翻译</el-divider>
            <p class="translation-text">{{activeSpot.desc}}</p>
        </div>
        <template #footer>
            <el-button type="success" @click="dialogVisible = false" style="width: 100%;">知道了</el-button>
        </template>
    </el-dialog>

    <el-menu mode="horizontal" class="nav-footer" default-active="1" active-text-color="#2e8b57">
        <el-menu-item index="1">首页</el-menu-item>
        <el-menu-item index="2">诗人</el-menu-item>
        <el-menu-item index="3">路线</el-menu-item>
        <el-menu-item index="4">我的</el-menu-item>
    </el-menu>
</div>

<script>
    const { createApp, ref, onMounted } = Vue;

    createApp({
        setup() {
            const dialogVisible = ref(false);
            const activeSpot = ref({});
            
            // 数据源：由包宇露负责填充 
            const spots = ref([
                { 
                    name: '黄鹤楼', 
                    poet: '李白', 
                    dynasty: '唐',
                    poem: '《黄鹤楼送孟浩然之广陵》', 
                    tag: '豪迈', 
                    desc: '老朋友在西边辞别了黄鹤楼，在柳絮如烟、繁花似锦的阳春三月去扬州。孤船的帆影渐渐远去，消失在碧空的尽头，只看见长江浩浩荡荡地向天边流去。', 
                    img: 'https://images.unsplash.com/photo-1599591459357-316279d47d3c?w=500' 
                },
                { 
                    name: '西湖', 
                    poet: '白居易', 
                    dynasty: '唐',
                    poem: '《钱塘湖春行》', 
                    tag: '清新', 
                    desc: '从孤山寺北到贾亭之西，湖水刚刚涨满，与岸齐平，云层很低。几只早莺争着飞向阳光暖和的树木，谁家新来的燕子正忙着衔泥筑巢。', 
                    img: 'https://images.unsplash.com/photo-1596434449071-729226501716?w=500' 
                }
            ]);

            // 弹窗交互：由李银焰负责优化 
            const showDetail = (item) => {
                activeSpot.value = item;
                dialogVisible.value = true;
            };

            onMounted(() => {
                // 地图初始化：由金丹彤负责实现联动 
                const chart = echarts.init(document.getElementById('map-container'));
                
                // 确保已将地图文件改名为 china.json 并上传
                fetch('./china.json')
                    .then(res => {
                        if(!res.ok) throw new Error("地图文件 china.json 没找到，请检查文件名！");
                        return res.json();
                    })
                    .then(geoJson => {
                        echarts.registerMap('china', geoJson);
                        chart.setOption({
                            geo: { 
                                map: 'china', 
                                roam: true, // 支持缩放
                                itemStyle: { areaColor: '#c1d8ac', borderColor: '#2f4f4f' },
                                emphasis: { itemStyle: { areaColor: '#a8c69f' } }
                            },
                            series: [{
    type: 'scatter',
    coordinateSystem: 'geo',
    // 在这里增加你文档中提到的所有地点 [cite: 8, 11]
    data: [
        { name: '武汉·黄鹤楼', value: [114.31, 30.52] },
        { name: '杭州·西湖', value: [120.15, 30.28] },
        { name: '南昌·滕王阁', value: [115.88, 28.69] },
        { name: '西安·大雁塔', value: [108.96, 34.22] },
        { name: '成都·杜甫草堂', value: [104.03, 30.66] }
    ],
    itemStyle: { 
        color: '#e31d1d' // 文档要求的红色标记点 [cite: 7, 11]
    },
    symbolSize: 12, // 标记点大小
    label: {
        show: false, // 默认不显示文字，点击或悬浮时可配置显示
        formatter: '{b}',
        position: 'right'
    }
}]；
                        
                        // 响应式地图大小
                        window.addEventListener('resize', () => chart.resize());
                    })
                    .catch(err => alert(err.message));
            });

            return { spots, dialogVisible, activeSpot, showDetail };
        }
    }).use(ElementPlus).mount('#app');
</script>

</body>
</html>
